{% extends "shop/basic.html" %}

{% block title %}Login - My Awesome Cart{% endblock %}

{% block body %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h2 class="fw-bold mb-4 text-center">Log In</h2>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form action="/shop/login/" method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        
                        <div class="mb-3">
                            <label for="loginusername" class="form-label text-muted small fw-bold text-uppercase">Username</label>
                            <input type="text" class="form-control form-control-lg" id="loginusername" name="loginusername" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="loginpassword" class="form-label text-muted small fw-bold text-uppercase">Password</label>
                            <input type="password" class="form-control form-control-lg" id="loginpassword" name="loginpassword" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Login</button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p class="text-muted">Don't have an account? <a href="/shop/signup/" class="text-decoration-none fw-semibold">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
