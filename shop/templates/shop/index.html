{% extends "shop/basic.html" %}
{% block title %} MyAwesomeCart — The Antigravity Edition {% endblock %}

{% block css %}
<style>
  /* 🪄 Resetting canvas constraints for a total weightless environment */
  body, html {
    overflow-x: hidden;
    background-color: #fdf6f9 !important;
  }

  /* 🏛️ The Central Editorial Brand Frame */
  .antigravity-hero {
    height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 10;
    pointer-events: none; /* Allows interacting with 3D elements underneath */
  }

  .floating-brand-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 5rem;
    font-weight: 700;
    color: #6b443a;
    letter-spacing: -0.1rem;
    animation: floatingText 6s ease-in-out infinite;
  }

  .floating-brand-sub {
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.3rem;
    font-size: 0.85rem;
    color: #f09fc1;
    font-weight: 600;
  }

  /* 🧴 Weightless Product Floating Matrix Styles */
  .floating-graphic-asset {
    position: absolute;
    z-index: 5;
    cursor: grab;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0 20px 30px rgba(107, 68, 58, 0.12));
  }
  .floating-graphic-asset:active {
    cursor: grabbing;
  }

  /* ✨ Gravity-Defying Keyframe Sequences */
  @keyframes floatingText {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
  }
</style>
{% endblock %}

{% block body %}
<div class="position-relative w-100 vh-100 overflow-hidden">

  <!-- 🏛️ Core Aesthetic Visual Overlay -->
  <div class="antigravity-hero">
    <span class="floating-brand-sub mb-2">Import Antigravity</span>
    <h1 class="floating-brand-title">MyAwesomeCart</h1>
    <p class="text-muted font-monospace mt-3" style="letter-spacing: 0.05rem;">[ A Spatial Graphic Experiment ]</p>
  </div>

  <!-- 🧴 Floating Graphic Elements Container Matrix -->
  <!-- Asset 01: Botanical Face Oil -->
  <div class="floating-graphic-asset interactive-float" style="top: 15%; left: 10%; width: 220px;" data-speed="1.2">
    <img src="https://images.unsplash.com/photo-1608248597481-496100c8c836?q=80&w=600&auto=format&fit=crop" class="img-fluid rounded-4" alt="Face Oil Sub-orbital Element">
  </div>

  <!-- Asset 02: Smoked Santal Candle -->
  <div class="floating-graphic-asset interactive-float" style="top: 55%; left: 75%; width: 250px;" data-speed="0.8">
    <img src="https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=600&auto=format&fit=crop" class="img-fluid rounded-4" alt="Santal Vessel element">
  </div>

  <!-- Asset 03: Pink French Clay Mask -->
  <div class="floating-graphic-asset interactive-float" style="top: 20%; left: 65%; width: 200px;" data-speed="1.5">
    <img src="https://images.unsplash.com/photo-1567894340315-735d7c361db0?q=80&w=600&auto=format&fit=crop" class="img-fluid rounded-4" alt="Clay Formulation asset">
  </div>

  <!-- Asset 04: Wild Lavender Reed Diffuser -->
  <div class="floating-graphic-asset interactive-float" style="top: 60%; left: 25%; width: 210px;" data-speed="1.0">
    <img src="https://images.unsplash.com/photo-1547483238-f400e65ccd56?q=80&w=600&auto=format&fit=crop" class="img-fluid rounded-4" alt="Diffuser Geometry asset">
  </div>

</div>

<!-- ⚙️ The Antigravity JavaScript Kinetic Physics Matrix -->
<script>
  document.addEventListener("mousemove", function(e) {
    const items = document.querySelectorAll(".interactive-float");
    
    items.forEach(item => {
      // Extract specific shifting speeds assigned to each graphic canvas layer
      const speed = parseFloat(item.getAttribute("data-speed"));
      
      // Calculate micro relative directional translation vectors
      const x = (window.innerWidth - e.pageX * speed) / 45;
      const y = (window.innerHeight - e.pageY * speed) / 45;
      
      // Update item coordinates instantly to produce depth parallax
      item.style.transform = `translateX(${x}px) translateY(${y}px) rotate(${x * 0.1}deg)`;
    });
  });

  // Basic Draggable Matrix Initialization so recruiters can toss the products around
  const draggables = document.querySelectorAll('.interactive-float');
  draggables.forEach(el => {
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    el.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialLeft = el.offsetLeft;
      initialTop = el.offsetTop;
      el.style.transition = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      el.style.left = `${initialLeft + dx}px`;
      el.style.top = `${initialTop + dy}px`;
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        el.style.transition = 'transform 0.1s ease-out';
      }
    });
  });
</script>
{% endblock %}
